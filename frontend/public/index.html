<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    [{[ if .ReCaptcha -]}]
    <script src="[{[ .ReCaptchaHost ]}]/recaptcha/api.js?render=explicit"></script>
    [{[ end ]}]

    <title>
      [{[ if .Name -]}][{[ .Name ]}][{[ else ]}]CPHDRIVE[{[ end ]}]
    </title>

    <meta name="robots" content="noindex,nofollow" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="[{[ .StaticURL ]}]/img/icons/favicon.svg"
    />
    <link rel="shortcut icon" href="[{[ .StaticURL ]}]/img/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="[{[ .StaticURL ]}]/img/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="CPHDRIVE" />

    <!-- Add to home screen for Android and modern mobile browsers -->
    <link
      rel="manifest"
      id="manifestPlaceholder"
      crossorigin="use-credentials"
    />
    <meta
      name="theme-color"
      content="[{[ if .Color -]}][{[ .Color ]}][{[ else ]}]#2979ff[{[ end ]}]"
    />

    <!-- Inject Some Variables and generate the manifest json -->
    <script>
      // We can assign JSON directly
      window.FileBrowser = [{[ .Json ]}];
      // Global function to prepend static url
      window.__prependStaticUrl = (url) => {
        return `${window.FileBrowser.StaticURL}/${url.replace(/^\/+/, "")}`;
      };
      var dynamicManifest = {
        name: window.FileBrowser.Name || "File Browser",
        short_name: window.FileBrowser.Name || "File Browser",
        icons: [
          {
            src:
              window.location.origin +
              window.__prependStaticUrl("/img/icons/android-chrome-192x192.png"),
            sizes: "192x192",
            type: "image/png",
          },
          {
            src:
              window.location.origin +
              window.__prependStaticUrl("/img/icons/android-chrome-512x512.png"),
            sizes: "512x512",
            type: "image/png",
          },
        ],
        start_url: window.location.origin + window.FileBrowser.BaseURL,
        display: "standalone",
        background_color: "#ffffff",
        theme_color: window.FileBrowser.Color || "#455a64",
      };

      const stringManifest = JSON.stringify(dynamicManifest);
      const blob = new Blob([stringManifest], { type: "application/json" });
      const manifestURL = URL.createObjectURL(blob);
      document
        .querySelector("#manifestPlaceholder")
        .setAttribute("href", manifestURL);
    </script>

    <style>
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        z-index: 9999;
        transition: 0.1s ease opacity;
        -webkit-transition: 0.1s ease opacity;
      }

      #loading.done {
        opacity: 0;
      }

      #loading .spinner {
        width: 70px;
        text-align: center;
        position: fixed;
        top: 50%;
        left: 50%;
        -webkit-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      #loading .spinner > div {
        width: 18px;
        height: 18px;
        background-color: #333;
        border-radius: 100%;
        display: inline-block;
        -webkit-animation: sk-bouncedelay 1.4s infinite ease-in-out both;
        animation: sk-bouncedelay 1.4s infinite ease-in-out both;
      }

      #loading .spinner .bounce1 {
        -webkit-animation-delay: -0.32s;
        animation-delay: -0.32s;
      }

      #loading .spinner .bounce2 {
        -webkit-animation-delay: -0.16s;
        animation-delay: -0.16s;
      }

      @-webkit-keyframes sk-bouncedelay {
        0%,
        80%,
        100% {
          -webkit-transform: scale(0);
        }
        40% {
          -webkit-transform: scale(1);
        }
      }

      @keyframes sk-bouncedelay {
        0%,
        80%,
        100% {
          -webkit-transform: scale(0);
          transform: scale(0);
        }
        40% {
          -webkit-transform: scale(1);
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loading">
      <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>

    [{[ if .CSS -]}]
    <link rel="stylesheet" href="[{[ .StaticURL ]}]/custom.css" />
    [{[ end ]}]

    <!-- Password reveal. Adds a .cf-eye button next to every password input
         and keeps it positioned when the layout moves. Ported from the
         deployed build, which carried it as an inline script. -->
    <script>
      (() => {
        const p = (i, b) => {
          const n = i.parentNode;
          n.style.position || (n.style.position = "relative");
          b.style.top = i.offsetTop + i.offsetHeight / 2 - 16 + "px";
          b.style.right = n.clientWidth - i.offsetLeft - i.offsetWidth + 8 + "px";
        };
        const d = () => {
          document
            .querySelectorAll(".cf-eye")
            .forEach((b) => (b._i && b._i.isConnected) || b.remove());
          document
            .querySelectorAll("input[type=password],input[data-cf-eye]")
            .forEach((n) => {
              let b = n._b;
              if (!n.hasAttribute("data-cf-eye")) {
                n.setAttribute("data-cf-eye", "");
                b = document.createElement("button");
                b.type = "button";
                b.className = "cf-eye";
                b.setAttribute("aria-label", "Show password");
                b.onpointerdown = (e) => e.preventDefault();
                b.onclick = (e) => {
                  e.preventDefault();
                  const t = n.type == "password" ? "text" : "password";
                  n.type = t;
                  b.classList.toggle("is-on", t == "text");
                  n.focus({ preventScroll: true });
                };
                b._i = n;
                n._b = b;
                n.parentNode.appendChild(b);
              }
              b.classList.toggle("is-on", n.type != "password");
              p(n, b);
            });
        };
        let t;
        const s = () => {
          clearTimeout(t);
          t = setTimeout(d, 60);
        };
        new MutationObserver(s).observe(document.documentElement, {
          childList: 1,
          subtree: 1,
        });
        addEventListener("resize", s);
        document.addEventListener("scroll", s, 1);
        d();
      })();
    </script>

    <!-- Share links are copied as the public Funnel host, not the LAN or
         tailnet address the browser happens to be on, so a link pasted into a
         chat works for someone outside the network. -->
    <script>
      (() => {
        const P = "https://cronzph-1.taildd796b.ts.net",
          R = (s) =>
            typeof s == "string"
              ? s.replace(/^https?:\/\/[^\/]+(?=\/(?:share|api\/public)\/)/, P)
              : s,
          c = navigator.clipboard;
        if (c && c.writeText) {
          const w = c.writeText.bind(c);
          c.writeText = (t) => w(R(t));
        }
        const e = document.execCommand.bind(document);
        document.execCommand = (k, ...a) => {
          if (k == "copy") {
            const l = document.activeElement;
            if (
              l &&
              typeof l.value == "string" &&
              /\/(?:share|api\/public)\//.test(l.value)
            ) {
              l.value = R(l.value);
              l.select && l.select();
            }
          }
          return e(k, ...a);
        };
      })();
    </script>
  </body>
</html>
